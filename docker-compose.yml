services:
  mysql:
    image: mysql:8.4
    container_name: sica-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_sica_dev
      MYSQL_DATABASE: sica_acme
      MYSQL_USER: sica_user
      MYSQL_PASSWORD: sica_dev_2026
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/data.sql:/docker-entrypoint-initdb.d/02_data.sql:ro

volumes:
  mysql_data:
